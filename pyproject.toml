[project]
name = "edge-trading-analyst"
version = "0.1.0"
description = "On-device (Jetson Orin Nano) multi-agent paper-trading analyst. Phase 1: deterministic core."
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_analyst"]

# Dev-only tooling. Never shipped to the Jetson runtime (`uv sync --no-dev` there);
# installed in CI and locally via `uv sync --dev`.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]
# LLM-as-judge (eval/modal_app.py). Local side only needs the Modal SDK to
# deploy/invoke — vllm + torch are pip_install'd inside the Modal image only,
# never a local dependency (same convention as the gaussian_splatting app).
eval = [
    # >=1.5, not the old >=0.63: modal_app.py's cost work needs APIs that only
    # exist in 1.x -- modal.parameter (per-model warm containers), the
    # scaledown_window/min_containers names, Image.uv_pip_install,
    # Secret.from_name(required_keys=...) and experimental_options.
    "modal>=1.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "eval"]

[tool.ruff.lint]
# Pragmatic default set: pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP),
# flake8-bugbear (B). Enough to catch real bugs and keep imports tidy without bikeshedding.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
