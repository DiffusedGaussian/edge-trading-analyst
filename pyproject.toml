[project]
name = "edge-trading-analyst"
version = "0.1.0"
description = "On-device (Jetson Orin Nano) multi-agent paper-trading analyst. Phase 1: deterministic core."
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_analyst"]
