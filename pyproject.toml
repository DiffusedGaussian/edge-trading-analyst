[project]
name = "edge-trading-analyst"
version = "0.1.0"
description = "On-device (Jetson Orin Nano) multi-agent paper-trading analyst. Phase 1: deterministic core."
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_analyst"]

# Dev-only tooling. Never shipped to the Jetson runtime (`uv sync --no-dev` there);
# installed in CI and locally via `uv sync --dev`.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Pragmatic default set: pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP),
# flake8-bugbear (B). Enough to catch real bugs and keep imports tidy without bikeshedding.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
